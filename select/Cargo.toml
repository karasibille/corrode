[package]
name = "corrode-select"
description = "Culling the shots of a shoot in the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "corrode-select"
path = "src/main.rs"

[dependencies]
corrode-core.workspace = true
corrode-ui.workspace = true
image = { version = "0.25", default-features = false }
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }

[dev-dependencies]
tempfile = "3.27.0"
