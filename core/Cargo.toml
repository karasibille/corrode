[package]
name = "corrode-core"
description = "Core library of corrode: JPEG/RAW pairing, RawTherapee .pp3 sidecars, decoding, effects"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["gif", "jpeg"] }
postcard = { version = "1", features = ["use-std"] }
rawler = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2"
